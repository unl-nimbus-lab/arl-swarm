# Build file for the swarm used in Phillips, Tran, Bradley, IEEE TAES 2026 (doi:10.1109/TAES.2026.3683620).
version: '3'

services:
  hrl_controller:
    image: grantphllps/hrl_docker_drone
    #image: clustering:latest
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    container_name: hrl
    network_mode: "host"
    volumes:
      - /home/ubuntu/rosbags:/home/verifier_logs
      - /home/ubuntu/arl-swarm/docker/drone:/home/drone
    devices: 
      - ${PORT}:${PORT}
      - ${RADIO}:${RADIO}
    command: >
      /bin/bash -c "source /home/catkin_ws/devel/setup.bash && 
                    export $$(cat /home/drone/.env) &&
                    roslaunch src/hrl_control/launch/hrl_control_drone.launch"
    restart: always
