version: '3'

services:
  frejya:
    # build: .
    image: ghcr.io/unl-nimbus-lab/arl-swarm/drone:latest
    container_name: frejya
    network_mode: "host"
    devices: 
      - /dev/ttyS0:/dev/ttyS0
    command: >
      /bin/bash -c "source /home/catkin_ws/devel/setup.bash &&
                    roslaunch src/Freyja/freyja_controller.launch vicon_topic:=dummy comm_port:=/dev/ttyS0:921600 tgt_system:=${SYS_ID}"
    restart: unless-stopped
    # volumes:
    #   - type: bind
    #     source: $HOST/location
    #     target: /container/location