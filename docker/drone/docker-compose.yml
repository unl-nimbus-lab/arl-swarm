version: '3'

services:
  anti_collision:
    image: grantphllps/verifier
    #image: clustering:latest
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    container_name: anti_collision
    network_mode: "host"
    devices: 
      - ${PORT}:${PORT}
      - ${PORT2}:${PORT2}
    command: >
      /bin/bash -c "source /home/catkin_ws/devel/setup.bash &&
                    roslaunch src/verifier/launch/container.launch system_ID:=${SYS_ID} homeLat:=${HOME_LAT} homeLon:=${HOME_LON} fcu_url:=${PORT}:${BAUD} tgt_system:=${SYS_ID} tgt_component:=1"
    restart: always
