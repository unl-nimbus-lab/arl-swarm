version: '3'

services:
  frejya:
    # build: .
    image: ghcr.io/unl-nimbus-lab/arl-swarm/drone:latest
    container_name: pre-planned_arl
    network_mode: "host"
    devices: 
      - /dev/ttyS0:/dev/ttyS0
    command: >
      /bin/bash -c "source /home/catkin_ws/devel/setup.bash &&
                    roslaunch src/pre-planned_arl/pre_planned_cube.launch
    restart: unless-stopped
    # volumes:
    #   - type: bind
    #     source: $HOST/location
    #     target: /container/location