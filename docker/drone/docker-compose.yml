version: '3'

services:
  frejya:
    # build: .
    image: ghcr.io/unl-nimbus-lab/arl-swarm/drone:latest
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    container_name: online_hrl
    network_mode: "host"
    volumes:
      - /home/ubuntu/rosbags:/home/rosbags
    devices: 
      - /dev/ttyUSB0:/dev/ttyUSB0
    command: >
      /bin/bash -c "/home/bag_manager.sh /home/rosbags 5 &&
                    source /home/catkin_ws/devel/setup.bash &&
                    roslaunch src/swarm-nodes/online_hrl.launch comm_port:=/dev/ttyS0:921600"

    #roslaunch src/swarm-nodes/test_launch.launch comm_port:=/dev/ttyS0:921600"
    
    restart: unless-stopped
    # volumes:
    #   - type: bind
    #     source: $HOST/location
    #     target: /container/location