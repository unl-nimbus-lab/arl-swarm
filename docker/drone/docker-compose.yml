version: '3'

services:
  mavros:
    # build: .
    image: ghcr.io/unl-nimbus-lab/docker/drone:latest
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    container_name: mavros
    network_mode: "host"
    volumes:
      - /home/ubuntu/rosbags:/home/rosbags
      - /home/ubuntu/config/:/home/config
    devices: 
      - /dev/ttyS0:/dev/ttyS0
    command: >
      /bin/bash -c "/home/bag_manager.sh /home/rosbags 5 &&
                    source /home/catkin_ws/devel/setup.bash &&
                    roslaunch /home/catkin_ws/src/online_hrl.launch comm_port:=${PORT}:${BAUD} tgt_system:=${SYS_ID} path_to_state_mtx:=${STATE_MTX}"
    restart: unless-stopped
    # volumes:
    #   - type: bind
    #     source: $HOST/location
    #     target: /container/location
