version: '3'

services:
  mavros:
    # build: .
    image: ghcr.io/unl-nimbus-lab/arl-swarm/drone:latest
    container_name: mavros
    network_mode: "host"
    devices: 
      - ${PORT}:${PORT}
    command: >
      /bin/bash -c "source /home/catkin_ws/devel/setup.bash &&
                    roslaunch src/mavros/mavros/launch/apm.launch fcu_url:=${PORT}:${BAUD} tgt_system:=${SYS_ID} tgt_component:=${COMP_ID}"
    restart: unless-stopped