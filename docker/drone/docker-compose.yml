version: '3'

services:
  anti_collision:
    image: grantphllps/verifier
    #image: clustering:latest
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    container_name: anti_collision
    network_mode: "host"
    volumes:
      - /home:/home/hosts_home
    devices: 
      - ${PORT}:${PORT}
      - ${PORT2}:${PORT2}
    command: >
      /bin/bash -c "source /home/catkin_ws/devel/setup.bash &&
                    source /home/log_manage.sh"
    restart: always
